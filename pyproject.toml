[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kdzwy-receipt-uploader"
version = "0.1.0"
description = "Authorized Kdzwy voucher and PDF attachment uploader"
requires-python = ">=3.10"

[project.scripts]
kdzwy-receipts = "kdzwy_receipt_uploader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
